nodeLinker: node-modules

# Yarn 4.18+ refuses npm versions published less than this many minutes ago
# (supply-chain guard). Stated explicitly so a CI failure that reads
# "All versions satisfying ... are quarantined" is recognisable: the fix is to
# wait for the release to age, not to loosen the lockfile. Renovate mirrors
# this with minimumReleaseAge in .github/renovate.json.
npmMinimalAgeGate: 1440
